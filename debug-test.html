<!DOCTYPE html>
<html>
<head>
    <title>Debug Navigation</title>
    <style>
        .content-section { display: none; padding: 20px; background: #f0f0f0; margin: 10px; }
        .content-section.active { display: block; }
        .nav-btn { padding: 10px; margin: 5px; }
        .nav-btn.active { background: blue; color: white; }
    </style>
</head>
<body>
    <h1>Debug Test - Testing Navigation</h1>
    
    <div>
        <button class="nav-btn active" data-section="about" onclick="switchSection('about')">About</button>
        <button class="nav-btn" data-section="writing" onclick="switchSection('writing')">Writing & Research</button>
        <button class="nav-btn" data-section="projects" onclick="switchSection('projects')">Projects</button>
    </div>
    
    <section id="about" class="content-section active">
        <h2>About Section</h2>
        <p>This is the about section content.</p>
    </section>
    
    <section id="writing" class="content-section">
        <h2>Writing & Research Section</h2>
        <p>If you can see this, the navigation is working!</p>
        <div style="background: yellow; padding: 10px; margin: 10px 0;">
            <strong>🎉 SUCCESS! The Writing section is visible!</strong>
        </div>
    </section>
    
    <section id="projects" class="content-section">
        <h2>Projects Section</h2>
        <p>This is the projects section content.</p>
    </section>
    
    <hr>
    <div id="log" style="background: #e0e0e0; padding: 10px; font-family: monospace;"></div>
    
    <script>
        function log(msg) {
            document.getElementById('log').innerHTML += msg + '<br>';
        }
        
        function switchSection(sectionName) {
            log('Switching to: ' + sectionName);
            
            // Remove active from all
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelectorAll('.content-section').forEach(sec => {
                sec.classList.remove('active');
            });
            
            // Add active to selected
            event.target.classList.add('active');
            const section = document.getElementById(sectionName);
            if (section) {
                section.classList.add('active');
                log('✓ Found and activated section: ' + sectionName);
            } else {
                log('✗ ERROR: Could not find section with id: ' + sectionName);
            }
        }
        
        log('Page loaded. Click buttons to test navigation.');
    </script>
</body>
</html>
